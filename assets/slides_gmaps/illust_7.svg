<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 680 520" width="680" height="520">
  <defs>
    <clipPath id="cardClip"><rect x="0" y="0" width="680" height="520" rx="26"/></clipPath>
    <clipPath id="phoneClip"><rect x="195" y="28" width="290" height="464" rx="34"/></clipPath>
  </defs>
  <g clip-path="url(#cardClip)">

    <rect x="0" y="0" width="680" height="520" fill="#0F172A"/>
    <rect x="24" y="20" width="632" height="50" rx="14" fill="#7C3AED" stroke="#DDD6FE" stroke-width="2"/>
    <text x="340" y="51" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="17" font-weight="bold">📐 KALKULATOR OTOMATIS POPULASI &amp; PUPUK (BLOK A1)</text>

    <!-- 4 Distinct Colored Metric Cards -->
    <rect x="24" y="88" width="304" height="135" rx="18" fill="#2563EB" stroke="#93C5FD" stroke-width="2.5"/>
    <text x="176" y="120" text-anchor="middle" fill="#DBEAFE" font-family="Arial" font-size="13.5" font-weight="bold">1. LUAS TOTAL POLIGON SATELIT</text>
    <text x="176" y="168" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="36" font-weight="bold">14,8 Ha</text>
    <text x="176" y="202" text-anchor="middle" fill="#FEF08A" font-family="Arial" font-size="13" font-weight="bold">Termasuk Jalan &amp; Parit (6%)</text>

    <rect x="352" y="88" width="304" height="135" rx="18" fill="#059669" stroke="#6EE7B7" stroke-width="2.5"/>
    <text x="504" y="120" text-anchor="middle" fill="#D1FAE5" font-family="Arial" font-size="13.5" font-weight="bold">2. LUAS BERSIH EFEKTIF (× 94%)</text>
    <text x="504" y="168" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="36" font-weight="bold">13,91 Ha</text>
    <text x="504" y="202" text-anchor="middle" fill="#FEF08A" font-family="Arial" font-size="13" font-weight="bold">Area Murni Ditanami Sawit</text>

    <rect x="24" y="242" width="304" height="135" rx="18" fill="#F59E0B" stroke="#FEF08A" stroke-width="2.5"/>
    <text x="176" y="274" text-anchor="middle" fill="#451A03" font-family="Arial" font-size="13.5" font-weight="bold">3. POPULASI POKOK (× 143/Ha)</text>
    <text x="176" y="322" text-anchor="middle" fill="#091E12" font-family="Arial" font-size="34" font-weight="bold">1.988 Pokok</text>
    <text x="176" y="356" text-anchor="middle" fill="#451A03" font-family="Arial" font-size="13" font-weight="bold">Jarak Tanam Segitiga 9×9m</text>

    <rect x="352" y="242" width="304" height="135" rx="18" fill="#E11D48" stroke="#FDA4AF" stroke-width="2.5"/>
    <text x="504" y="274" text-anchor="middle" fill="#FFE4E6" font-family="Arial" font-size="13.5" font-weight="bold">4. KEBUTUHAN PUPUK NPK (× 2,5 Kg)</text>
    <text x="504" y="322" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="36" font-weight="bold">4,97 Ton</text>
    <text x="504" y="356" text-anchor="middle" fill="#FEF08A" font-family="Arial" font-size="13" font-weight="bold">Presisi Dosis per Rotasi Aplikasi</text>

    <!-- Bottom Export KML Banner -->
    <rect x="24" y="396" width="632" height="100" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="340" y="434" text-anchor="middle" fill="#38BDF8" font-family="Arial" font-size="16" font-weight="bold">📲 EKSPOR KE FILE .KML / .KMZ (STANDAR GIS INTERNASIONAL)</text>
    <text x="340" y="466" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="14">Bisa langsung dibuka di Google Earth HP, Avenza Maps, Garmin &amp; QGIS!</text>
  </g>
</svg>